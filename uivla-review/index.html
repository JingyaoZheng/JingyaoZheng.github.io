<!doctype html><meta charset="utf-8"><title>UiVLA review (restricted)</title>
<style>body{font-family:Segoe UI,sans-serif;display:flex;min-height:90vh;align-items:center;
justify-content:center;background:#111;color:#eee}.box{text-align:center}
input{font-size:16px;padding:8px;border-radius:6px;border:1px solid #555;width:280px}
button{font-size:15px;padding:8px 18px;margin-left:8px;border-radius:6px;border:0;
background:#2563eb;color:#fff;cursor:pointer}
#msg{margin-top:12px;color:#f87171;min-height:1.2em}</style>
<div class="box"><h2>Restricted research material</h2>
<p>Aria Everyday Activities derived imagery. Authorised access only.</p>
<input id="pw" type="password" placeholder="passphrase" autofocus>
<button onclick="go()">Open</button><div id="msg"></div></div>
<script>
const SALT="dwS35Ap2XrqHNmi+C+LF+w==", IV="tuOd+ebbEekMQ30J", ITERS=600000;
const b2a = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function go() {
  const msg = document.getElementById('msg'); msg.textContent = 'decrypting\u2026';
  try {
    const pw = document.getElementById('pw').value;
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
      'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b2a(SALT), iterations:ITERS, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const ct = await (await fetch('payload.bin')).arrayBuffer();
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b2a(IV)}, key, ct);
    document.open(); document.write(new TextDecoder().decode(pt)); document.close();
  } catch (e) { msg.textContent = 'wrong passphrase (or fetch failed)'; }
}
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
</script>
